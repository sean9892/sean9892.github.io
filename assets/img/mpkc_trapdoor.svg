<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="diagram">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <style>
      .title { font: 700 24px system-ui, -apple-system, Segoe UI, sans-serif; fill: #1f2937; }
      .label { font: 600 15px system-ui, -apple-system, Segoe UI, sans-serif; fill: #111827; }
      .small { font: 13px system-ui, -apple-system, Segoe UI, sans-serif; fill: #374151; }
      .tiny { font: 12px system-ui, -apple-system, Segoe UI, sans-serif; fill: #4b5563; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; rx: 14; }
      .accent { fill: #eef2ff; stroke: #4338ca; stroke-width: 1.5; rx: 14; }
      .warn { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.5; rx: 14; }
      .ok { fill: #ecfdf5; stroke: #047857; stroke-width: 1.5; rx: 14; }
      .muted { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.2; rx: 14; }
      .line { stroke: #333; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="1100" height="520" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" class="title">The Standard MPKC Trapdoor Pattern</text>
  <text x="550" y="78" text-anchor="middle" class="small">Public key exposes a quadratic map P; secret key keeps the easy-to-invert structure of F hidden.</text>
  <rect x="70" y="160" width="135" height="80" class="box"/>
  <text x="137" y="192" text-anchor="middle" class="label">message</text>
  <text x="137" y="210" text-anchor="middle" class="label">x ∈ 𝔽ⁿ</text>
  <rect x="270" y="160" width="145" height="80" class="accent"/>
  <text x="342" y="190" text-anchor="middle" class="label">secret affine</text>
  <text x="342" y="208" text-anchor="middle" class="label">T</text>
  <rect x="480" y="145" width="160" height="110" class="warn"/>
  <text x="560" y="178" text-anchor="middle" class="label">central map</text>
  <text x="560" y="196" text-anchor="middle" class="label">F</text>
  <text x="560" y="214" text-anchor="middle" class="label">easy with trapdoor</text>
  <rect x="705" y="160" width="145" height="80" class="accent"/>
  <text x="777" y="190" text-anchor="middle" class="label">secret affine</text>
  <text x="777" y="208" text-anchor="middle" class="label">S</text>
  <rect x="915" y="160" width="135" height="80" class="box"/>
  <text x="982" y="192" text-anchor="middle" class="label">output</text>
  <text x="982" y="210" text-anchor="middle" class="label">y = P(x)</text>
  <path d="M 205 200 L 265 200" class="line"/>
  <path d="M 415 200 L 475 200" class="line"/>
  <path d="M 640 200 L 705 200" class="line"/>
  <path d="M 850 200 L 915 200" class="line"/>

  <rect x="315" y="330" width="470" height="80" class="ok"/>
  <text x="550" y="365" text-anchor="middle" class="label">Public key: P = S ∘ F ∘ T</text>
  <text x="550" y="383" text-anchor="middle" class="label">Secret key: (S, F, T) and the data needed to invert them</text>
  <path d="M 982 245 L 780 330" class="dash"/>
  <path d="M 137 245 L 320 330" class="dash"/>
  <text x="550" y="475" text-anchor="middle" class="small">Attackers see only many quadratic polynomials. The design challenge is hiding structure without making P too large.</text>
</svg>