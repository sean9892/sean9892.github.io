<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="940" viewBox="0 0 1800 940" role="img" aria-label="Five families of post-quantum cryptography">
  <defs>
    <style>
      .title { font-family: Inter, Arial, sans-serif; font-size: 36px; font-weight: 800; text-anchor: middle; }
      .titleSmall { font-family: Inter, Arial, sans-serif; font-size: 30px; font-weight: 800; text-anchor: middle; }
      .scheme { font-family: Inter, Arial, sans-serif; font-size: 19px; font-weight: 700; text-anchor: middle; }
      .schemeSmall { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 700; text-anchor: middle; }
      .math { font-family: 'Times New Roman', serif; font-size: 20px; font-style: italic; }
      .panel { stroke-width: 2; rx: 20; ry: 20; }
      .divider { stroke-width: 2; }
      .arrow { fill: none; stroke-width: 5; marker-end: url(#arrowBlue); }
      .level { font-family: 'Times New Roman', serif; font-size: 18px; font-style: italic; }
    </style>

    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#155aa0"/>
    </marker>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.10"/>
    </filter>

    <clipPath id="clipFigure4"><rect x="0" y="0" width="220" height="330" rx="4"/></clipPath>
    <clipPath id="clipFigure5"><rect x="0" y="0" width="274" height="330" rx="4"/></clipPath>
  </defs>

  <rect width="1800" height="940" fill="#ffffff"/>

  <!-- Panel 1: Hash-based -->
  <g transform="translate(20,95)">
    <rect class="panel" width="334" height="750" fill="#eef7ff" stroke="#8bbce9" filter="url(#softShadow)"/>
    <text class="title" x="167" y="75" fill="#0c3b78">Hash-based</text>
    <g transform="translate(57,140)">
      <rect x="0" y="0" width="220" height="330" fill="none"/>
      <rect x="65" y="0" width="90" height="54" rx="8" fill="#d9ecfb" stroke="#155aa0" stroke-width="2"/>
      <text x="110" y="35" font-family="Inter, Arial, sans-serif" font-size="25" text-anchor="middle" fill="#111">Input</text>
      <line x1="110" y1="62" x2="110" y2="108" class="arrow" stroke="#155aa0"/>
      <path d="M28,112 L192,112 L160,232 L60,232 Z" fill="#79b7e8" stroke="#155aa0" stroke-width="2.2"/>
      <text x="110" y="164" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#0d3768">Hash</text>
      <text x="110" y="197" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#0d3768">Function</text>
      <line x1="110" y1="240" x2="110" y2="285" class="arrow" stroke="#155aa0"/>
      <rect x="56" y="292" width="108" height="52" rx="8" fill="#d9ecfb" stroke="#155aa0" stroke-width="2"/>
      <text x="110" y="326" font-family="Inter, Arial, sans-serif" font-size="25" text-anchor="middle" fill="#111">Digest</text>
    </g>
    <line class="divider" x1="25" y1="560" x2="309" y2="560" stroke="#0c3b78"/>
    <text class="scheme" x="167" y="637" fill="#0c3b78">SPHINCS+  •  XMSS</text>
  </g>

  <!-- Panel 2: Lattice-based -->
  <g transform="translate(374,95)">
    <rect class="panel" width="334" height="750" fill="#f0faef" stroke="#9bc98d" filter="url(#softShadow)"/>
    <text class="title" x="167" y="75" fill="#16602b">Lattice-based</text>
    <g transform="translate(57,145)">
      <rect x="0" y="0" width="220" height="330" fill="none"/>
      <g transform="translate(0,35)">
        <g stroke="#8a8a8a" stroke-width="2" opacity="0.95">
          <line x1="10" y1="210" x2="70" y2="10"/>
          <line x1="50" y1="210" x2="110" y2="10"/>
          <line x1="90" y1="210" x2="150" y2="10"/>
          <line x1="130" y1="210" x2="190" y2="10"/>
          <line x1="170" y1="210" x2="230" y2="10"/>
          <line x1="10" y1="210" x2="210" y2="210"/>
          <line x1="25" y1="160" x2="225" y2="160"/>
          <line x1="40" y1="110" x2="240" y2="110"/>
          <line x1="55" y1="60" x2="255" y2="60"/>
          <line x1="70" y1="10" x2="270" y2="10"/>
        </g>
        <g fill="#878787" stroke="#666" stroke-width="0.8">
          <circle cx="10" cy="210" r="7"/><circle cx="50" cy="210" r="7"/><circle cx="90" cy="210" r="7"/><circle cx="130" cy="210" r="7"/><circle cx="170" cy="210" r="7"/>
          <circle cx="25" cy="160" r="7"/><circle cx="65" cy="160" r="7"/><circle cx="105" cy="160" r="7"/><circle cx="145" cy="160" r="7"/><circle cx="185" cy="160" r="7"/>
          <circle cx="40" cy="110" r="7"/><circle cx="80" cy="110" r="7"/><circle cx="120" cy="110" r="7"/><circle cx="160" cy="110" r="7"/><circle cx="200" cy="110" r="7"/>
          <circle cx="55" cy="60" r="7"/><circle cx="95" cy="60" r="7"/><circle cx="135" cy="60" r="7"/><circle cx="175" cy="60" r="7"/><circle cx="215" cy="60" r="7"/>
          <circle cx="70" cy="10" r="7"/><circle cx="110" cy="10" r="7"/><circle cx="150" cy="10" r="7"/><circle cx="190" cy="10" r="7"/><circle cx="230" cy="10" r="7"/>
        </g>
        <circle cx="65" cy="160" r="7" fill="#0b68b6"/>
        <line x1="65" y1="160" x2="128" y2="18" stroke="#1b9a34" stroke-width="5" marker-end="url(#arrowBlue)"/>
        <line x1="65" y1="160" x2="195" y2="138" stroke="#155aa0" stroke-width="5" marker-end="url(#arrowBlue)"/>
        <text x="138" y="20" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#1b9a34">u</text>
        <text x="204" y="145" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#155aa0">v</text>
      </g>
    </g>
    <line class="divider" x1="25" y1="560" x2="309" y2="560" stroke="#16602b"/>
    <text class="scheme" x="167" y="637" fill="#16602b">CRYSTALS-Kyber  •  Dilithium</text>
    <text class="scheme" x="167" y="682" fill="#16602b">FALCON</text>
  </g>

  <!-- Panel 3: Code-based -->
  <g transform="translate(728,95)">
    <rect class="panel" width="334" height="750" fill="#fff8e8" stroke="#dfac34" filter="url(#softShadow)"/>
    <text class="title" x="167" y="75" fill="#9b6700">Code-based</text>
    <g transform="translate(57,145)">
      <rect x="0" y="0" width="220" height="330" fill="none"/>
      <rect x="10" y="20" width="200" height="55" rx="8" fill="#fff4cc" stroke="#c18300" stroke-width="2"/>
      <text x="110" y="56" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="10" text-anchor="middle" fill="#9b6700">1011001</text>
      <line x1="110" y1="88" x2="110" y2="128" class="arrow" stroke="#155aa0"/>
      <g transform="translate(60,140)">
        <polygon points="0,20 70,20 100,0 30,0" fill="#83bdeb" stroke="#155aa0" stroke-width="2"/>
        <polygon points="70,20 100,0 100,80 70,100" fill="#5e9ad0" stroke="#155aa0" stroke-width="2"/>
        <rect x="0" y="20" width="70" height="80" fill="#76afe1" stroke="#155aa0" stroke-width="2"/>
        <text x="35" y="72" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700" text-anchor="middle" fill="#0d3768">H</text>
      </g>
      <line x1="110" y1="255" x2="110" y2="295" class="arrow" stroke="#155aa0"/>
      <rect x="10" y="305" width="200" height="55" rx="8" fill="#fff4cc" stroke="#c18300" stroke-width="2"/>
      <text x="110" y="341" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="10" text-anchor="middle" fill="#9b6700">0011010</text>
    </g>
    <line class="divider" x1="25" y1="560" x2="309" y2="560" stroke="#9b6700"/>
    <text class="schemeSmall" x="167" y="637" fill="#9b6700">Classic McEliece  •  BIKE  •  HQC</text>
  </g>

  <!-- Panel 4: Isogeny-based -->
  <g transform="translate(1082,95)">
    <rect class="panel" width="334" height="750" fill="#f8f2ff" stroke="#bca4da" filter="url(#softShadow)"/>
    <text class="title" x="167" y="75" fill="#64229a">Isogeny-based</text>

    <g transform="translate(57,135)" clip-path="url(#clipFigure4)">
      <rect x="0" y="0" width="220" height="330" fill="none"/>
      <text x="110" y="32" font-family="Times New Roman, serif" font-size="22" font-style="italic" text-anchor="middle" fill="#64229a">isogeny graph</text>

      <!-- Graph interpreted from the reference image, redrawn as clean SVG vectors. -->
      <g transform="translate(24,92) scale(0.78)">
        <g stroke="#9063ba" stroke-width="4" stroke-linecap="round" fill="none">
          <!-- central cycle -->
          <line x1="152" y1="110" x2="166" y2="152"/>
          <line x1="166" y1="152" x2="152" y2="194"/>
          <line x1="152" y1="194" x2="110" y2="208"/>
          <line x1="110" y1="208" x2="68" y2="194"/>
          <line x1="68" y1="194" x2="54" y2="152"/>
          <line x1="54" y1="152" x2="68" y2="110"/>
          <line x1="68" y1="110" x2="110" y2="96"/>
          <line x1="110" y1="96" x2="152" y2="110"/>

          <!-- outward stems -->
          <line x1="110" y1="96" x2="110" y2="56"/>
          <line x1="152" y1="110" x2="184" y2="88"/>
          <line x1="166" y1="152" x2="204" y2="146"/>
          <line x1="152" y1="194" x2="178" y2="228"/>
          <line x1="110" y1="208" x2="112" y2="244"/>
          <line x1="68" y1="194" x2="42" y2="226"/>
          <line x1="54" y1="152" x2="18" y2="148"/>
          <line x1="68" y1="110" x2="36" y2="86"/>

          <!-- outer branches, all contained within the figure region -->
          <line x1="110" y1="56" x2="110" y2="30"/>
          <line x1="110" y1="56" x2="96" y2="42"/>
          <line x1="110" y1="56" x2="124" y2="42"/>

          <line x1="184" y1="88" x2="204" y2="72"/>
          <line x1="184" y1="88" x2="188" y2="62"/>
          <line x1="184" y1="88" x2="208" y2="92"/>

          <line x1="204" y1="146" x2="222" y2="134"/>
          <line x1="204" y1="146" x2="224" y2="148"/>
          <line x1="204" y1="146" x2="216" y2="166"/>

          <line x1="178" y1="228" x2="194" y2="246"/>
          <line x1="178" y1="228" x2="182" y2="250"/>
          <line x1="178" y1="228" x2="160" y2="246"/>

          <line x1="112" y1="244" x2="112" y2="268"/>
          <line x1="112" y1="244" x2="96" y2="262"/>
          <line x1="112" y1="244" x2="128" y2="262"/>

          <line x1="42" y1="226" x2="24" y2="244"/>
          <line x1="42" y1="226" x2="38" y2="250"/>
          <line x1="42" y1="226" x2="58" y2="244"/>

          <line x1="18" y1="148" x2="2" y2="138"/>
          <line x1="18" y1="148" x2="0" y2="150"/>
          <line x1="18" y1="148" x2="4" y2="164"/>

          <line x1="36" y1="86" x2="18" y2="68"/>
          <line x1="36" y1="86" x2="14" y2="82"/>
          <line x1="36" y1="86" x2="30" y2="62"/>
        </g>

        <g fill="#64229a">
          <circle cx="110" cy="96" r="7"/>
          <circle cx="152" cy="110" r="7"/>
          <circle cx="166" cy="152" r="7"/>
          <circle cx="152" cy="194" r="7"/>
          <circle cx="110" cy="208" r="7"/>
          <circle cx="68" cy="194" r="7"/>
          <circle cx="54" cy="152" r="7"/>
          <circle cx="68" cy="110" r="7"/>
          <circle cx="110" cy="56" r="6"/>
          <circle cx="184" cy="88" r="6"/>
          <circle cx="204" cy="146" r="6"/>
          <circle cx="178" cy="228" r="6"/>
          <circle cx="112" cy="244" r="6"/>
          <circle cx="42" cy="226" r="6"/>
          <circle cx="18" cy="148" r="6"/>
          <circle cx="36" cy="86" r="6"/>
        </g>
      </g>
    </g>

    <line class="divider" x1="25" y1="560" x2="309" y2="560" stroke="#64229a"/>
    <text class="scheme" x="167" y="637" fill="#64229a">SIKE  •  CSIDH  •  SQISign</text>
  </g>


  <!-- Panel 5: Multivariate-based -->
  <g transform="translate(1436,95)">
    <rect class="panel" width="334" height="750" fill="#fff2f6" stroke="#eda5b6" filter="url(#softShadow)"/>
    <text class="titleSmall" x="167" y="75" fill="#a01657">Multivariate-based</text>
    <g transform="translate(22,145)" clip-path="url(#clipFigure5)">
      <rect x="0" y="0" width="274" height="330" fill="none"/>
      <g transform="translate(0,44)">
        <rect x="0" y="0" width="166" height="44" rx="6" fill="#ffe1e8" stroke="#d65685" stroke-width="1.5"/>
        <text class="math" x="12" y="28" fill="#111">f<tspan baseline-shift="sub" font-size="14">1</tspan>(x<tspan baseline-shift="sub" font-size="14">1</tspan>, x<tspan baseline-shift="sub" font-size="14">2</tspan>, ..., x<tspan baseline-shift="sub" font-size="14">n</tspan>) = 0</text>

        <rect x="0" y="74" width="166" height="44" rx="6" fill="#ffe9e1" stroke="#e59667" stroke-width="1.5"/>
        <text class="math" x="12" y="102" fill="#111">f<tspan baseline-shift="sub" font-size="14">2</tspan>(x<tspan baseline-shift="sub" font-size="14">1</tspan>, x<tspan baseline-shift="sub" font-size="14">2</tspan>, ..., x<tspan baseline-shift="sub" font-size="14">n</tspan>) = 0</text>

        <g fill="#111"><circle cx="84" cy="145" r="2.6"/><circle cx="84" cy="160" r="2.6"/><circle cx="84" cy="175" r="2.6"/></g>

        <rect x="0" y="206" width="166" height="44" rx="6" fill="#ffe1e8" stroke="#d65685" stroke-width="1.5"/>
        <text class="math" x="12" y="234" fill="#111">f<tspan baseline-shift="sub" font-size="14">m</tspan>(x<tspan baseline-shift="sub" font-size="14">1</tspan>, x<tspan baseline-shift="sub" font-size="14">2</tspan>, ..., x<tspan baseline-shift="sub" font-size="14">n</tspan>) = 0</text>

        <path d="M182,14 C194,14 194,14 194,73 C194,118 194,128 206,128 C194,128 194,138 194,184 C194,236 194,236 182,236" fill="none" stroke="#111" stroke-width="3"/>
        <line x1="208" y1="128" x2="232" y2="128" stroke="#155aa0" stroke-width="5" marker-end="url(#arrowBlue)"/>

        <rect x="236" y="16" width="46" height="216" rx="7" fill="#ffeaf0" stroke="#d65685" stroke-width="1.5"/>
        <text class="math" x="247" y="46">x<tspan baseline-shift="sub" font-size="14">1</tspan></text>
        <text class="math" x="247" y="88">x<tspan baseline-shift="sub" font-size="14">2</tspan></text>
        <g fill="#111"><circle cx="259" cy="113" r="2.6"/><circle cx="259" cy="128" r="2.6"/><circle cx="259" cy="143" r="2.6"/></g>
        <text class="math" x="247" y="192">x<tspan baseline-shift="sub" font-size="14">n</tspan></text>
      </g>
    </g>
    <line class="divider" x1="25" y1="560" x2="309" y2="560" stroke="#a01657"/>
    <text class="scheme" x="167" y="637" fill="#a01657">Rainbow  •  GeMSS  •  MAYO</text>
  </g>
</svg>
